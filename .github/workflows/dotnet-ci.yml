name: .NET CI

on:
  push:
    branches: [ main, part-3 ]
  pull_request:
    branches: [ main, part-3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (API & MVC Web)
        run: dotnet restore "RaceDay.slnx"

      - name: Build solution (RaceDay.Api & RaceDay.Web)
        run: dotnet build "RaceDay.slnx" --configuration Release --no-restore

      - name: Build MVC Web project explicitly
        run: dotnet build "src/RaceDay.Web/RaceDay.Web.csproj" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "RaceDay.slnx" --configuration Release --no-build --verbosity normal
